services:
  main:
    depends_on:
      - broker
    environment:
      BROKER_URL: http://broker:8000

  broker:
    image: localhost/openfingym-broker
    pull_policy: never
    environment:
      BROKER_CONFIG: /broker/episode.json
      # Wait out the 5-minute forecast horizon so /score can settle it.
      BROKER_SCORE_DEADLINE_SEC: "420"
    volumes:
      - ./episode.json:/broker/episode.json:ro
      - ledger:/ledger

volumes:
  ledger:
