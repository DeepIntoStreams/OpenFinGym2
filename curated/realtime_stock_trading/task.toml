schema_version = "1.4"

# Collected from the broker sidecar so the trial keeps the episode ledger
artifacts = [{ source = "/ledger/episode.jsonl", service = "broker" }]

[task]
name = "openfingym/realtime_stock_trading"
version = "1.0.0"
description = "Trading on live US equity market data."
authors = []
keywords = ["realtime", "trading", "stock"]

[metadata]
family = "realtime_trading"
category = "machine-learning"
difficulty_explanation = "Requires acting on live US equities without look-ahead."

[verifier]
environment_mode = "shared"
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "allowlist"
allowed_hosts = ["data.alpaca.markets", "stream.data.alpaca.markets"]
build_timeout_sec = 900.0
os = "linux"
cpus = 2
memory_mb = 4096

[environment.env]
ALPACA_API_KEY = "${ALPACA_API_KEY_ID}"
ALPACA_SECRET_KEY = "${ALPACA_API_SECRET_KEY}"
