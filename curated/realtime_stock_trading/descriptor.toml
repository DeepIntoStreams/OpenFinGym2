# Fields a paper may set on this bundle. Anything absent falls back to defaults.
task_id = "realtime_stock_trading"
scope_id = "realtime_trading"
description = """\
Live paper trading on US equities via Alpaca. The agent submits one order per \
step against the live book and is scored on the resulting account."""

[config_schema.symbols]
type = "list[str]"
notes = "US equity tickers the agent may trade. Common stocks and major ETFs only, no exchange suffix."

[config_schema.target_symbols]
type = "list[str]"
notes = "Subset of symbols the metrics are scored on. Trades outside it are allowed but do not count."

[config_schema.data_resolution]
type = "str"
options = ["1m", "5m", "15m", "1h"]
notes = "Bar cadence the episode steps at. Must be the finest interval in context_resolutions."

[config_schema.context_resolutions]
type = "list[{interval, bars}]"
notes = "Observation history per interval. Sub-hourly intervals only carry data during market hours."

[config_schema.max_steps]
type = "int"
notes = "Bars per episode. An episode cannot outlive the trading session."

[defaults]
symbols = ["SPY", "QQQ", "IWM"]
target_symbols = ["SPY", "QQQ"]
data_resolution = "1m"
context_resolutions = [
    { interval = "1m", bars = 60 },
    { interval = "5m", bars = 24 },
    { interval = "1h", bars = 24 },
]
max_steps = 10
step_interval_sec = 60
