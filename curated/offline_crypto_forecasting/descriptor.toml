# Fields a paper may set on this bundle. Anything absent falls back to defaults.
task_id  = "offline_crypto_forecasting"
scope_id = "offline_forecasting"
description = """\
Batch forecasting over historical bars for crypto pairs."""

[config_schema.symbols]
type = "list[str]"
notes = "Binance perpetual pair symbols such as BTCUSDT. Map a pair quoted against another currency onto its USDT equivalent."

[config_schema.target_symbols]
type = "list[str]"
notes = "Subset of symbols the metrics score. The others may still be traded for hedging but do not count."

[config_schema.interval]
type = "str"
options = ["1m", "5m", "15m", "30m", "1h", "4h", "1d", "1w"]
notes = "Bar interval the series is sampled at."

[config_schema.start]
type = "date"
notes = "Sample start, inclusive, YYYY-MM-DD."

[config_schema.end]
type = "date"
notes = "Sample end, exclusive."

[config_schema.train_ratio]
type = "float"
notes = "Fraction of the sample used for training, chronologically."

[config_schema.forecast_horizon_bars]
type = "int"
notes = "How many bars ahead the target sits."

[defaults]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
target_symbols = ["BTCUSDT", "ETHUSDT"]
interval = "1h"
start = "2020-01-01"
end = "2023-01-01"
train_ratio = 0.8
forecast_horizon_bars = 1
headline_metric = "mape"
