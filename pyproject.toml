[project]
name = "open-fin-gym"
version = "0.1.0"
description = "Financial agent benchmark and training task generation, and training utilities"
readme = "README.md"
authors = [
    # TODO: Add authors
    { name = "jlanghamlopez", email = "jlanghamlopez@turing.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.0",
    "docker>=7.2.0",
    "habanero>=2.4.0",
    "hydra-core>=1.3.2",
    "jinja2>=3.1.6",
    "langchain>=1.3.16",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "lxml>=5.3.0",
    "mlflow>=3.14.0",
    "pydantic>=2.13.4",
    "pylint>=4.0.6",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "semanticscholar>=0.12.0",
    "sqlalchemy>=2.0.50",
    "taskipy>=1.14.1",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "piccolo-theme>=0.24.0",
    "harbor>=0.20.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.0",
]

[tool.taskipy.tasks]
pipeline = "python -m open_fin_gym.pipeline"
docs = { cmd = "sphinx-build -W -b html docs/source docs/build", help="Build docs"}
mlflow = "mlflow server --host 127.0.0.1 --port 8080 --backend-store-uri sqlite:///./mlruns.db"

[tool.pytest.ini_options]
python_classes = ["PytestCollect*"]
